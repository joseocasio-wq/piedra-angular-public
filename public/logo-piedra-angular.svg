<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-label="Logo oficial de Piedra Angular Inc.">
  <defs>
    <filter id="crisp" x="-10%" y="-10%" width="120%" height="120%">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.15" intercept="-0.02"/>
        <feFuncG type="linear" slope="1.15" intercept="-0.02"/>
        <feFuncB type="linear" slope="1.15" intercept="-0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <image x="35" y="0" width="350" height="350" preserveAspectRatio="xMidYMid meet" href="/logo-piedra-angular.webp" filter="url(#crisp)"/>
  <line x1="55" y1="370" x2="365" y2="370" stroke="#d4a437" stroke-width="3"/>
  <text x="210" y="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#f0c75c">SANANDO HERIDAS · RESTAURANDO VIDAS</text>
  <text x="210" y="426" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#f0c75c">ALCANZANDO AL MUNDO</text>
  <text x="210" y="455" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#e7e9ec">1 PEDRO 2:4–5</text>
</svg>